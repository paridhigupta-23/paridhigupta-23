<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Paridhi Gupta — Profile Header</title>
  <desc id="desc">A burgundy and ivory editorial banner for a software and AI/ML student.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#260D18"/>
      <stop offset=".55" stop-color="#5A1D35"/>
      <stop offset="1" stop-color="#8B3D55"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9B8C3" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E9B8C3" stop-opacity=".8"/>
      <stop offset="1" stop-color="#E9B8C3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#F8EDE8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <circle cx="1030" cy="120" r="190" fill="none" stroke="#F0C8D0" stroke-opacity=".16" stroke-width="1.5"/>
  <circle cx="1030" cy="120" r="145" fill="none" stroke="#F0C8D0" stroke-opacity=".22" stroke-width="1.5"/>
  <circle cx="1030" cy="120" r="98" fill="none" stroke="#F0C8D0" stroke-opacity=".3" stroke-width="1.5"/>
  <path d="M850 270L1030 90L1180 240" fill="none" stroke="#F0C8D0" stroke-opacity=".45" stroke-width="1.5"/>
  <path d="M780 290H1150" stroke="url(#line)" stroke-width="1"/>
  <rect x="76" y="66" width="8" height="206" rx="4" fill="#E7A8B8"/>
  <text x="112" y="112" fill="#E8B9C5" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="5">ECE · SOFTWARE · AI/ML</text>
  <text x="108" y="190" fill="#FFF7F1" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="bold">PARIDHI GUPTA</text>
  <text x="112" y="232" fill="#F3DDE1" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing=".5">Building ideas into thoughtful, practical technology.</text>
  <text x="112" y="292" fill="#E8B9C5" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3">HYDERABAD, INDIA  /  ALWAYS LEARNING, ALWAYS BUILDING</text>
  <circle cx="1105" cy="275" r="5" fill="#E7A8B8"/>
  <circle cx="1130" cy="275" r="5" fill="#E7A8B8" fill-opacity=".6"/>
  <circle cx="1155" cy="275" r="5" fill="#E7A8B8" fill-opacity=".3"/>
